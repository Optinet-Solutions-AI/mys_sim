openapi: 3.1.0
info:
  title: Misty-style mystery box API
  version: 1.2.0
  description: >-
    Backend of a priced mystery box with published odds, a secret committed before payment, a player seed,
    free spins, site credit and a public verifier. Kit v1.1, 14 October 2026. See README.md for the rules and
    section 0 for what changed since 1.0. 1.2 adds battles (BATTLES.md). Every error body is { code, message, details? } (schema Error).
servers:
  - url: https://api.example.com/v1
tags:
  - name: boxes
  - name: opens
  - name: awards
  - name: credit
  - name: verify
  - name: admin
  - name: battles

paths:
  /boxes:
    get:
      tags: [boxes]
      summary: List active boxes with the current odds table, bonus table, hashes and maths
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Box" }

  /boxes/{slug}:
    get:
      tags: [boxes]
      summary: One box, its ordered odds table, bonus table, hashes, maths and trade-in rate
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Box" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /opens:
    post:
      tags: [opens]
      summary: Create an open and commit to the secret (before payment)
      description: >-
        Generates a 32-byte CSPRNG server seed, stores it encrypted, pins the box price and the current table and
        bonus hashes (or the player's segment table), and returns the hash of the seed. Expires if unpaid (15 minutes).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boxSlug]
              properties:
                boxSlug: { type: string, example: timepiece-suite }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenCommitted" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /opens/{openId}/client-seed:
    put:
      tags: [opens]
      summary: Set the player's seed (only while status is created, before payment)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/openId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSeed]
              properties:
                clientSeed: { type: string, minLength: 1, maxLength: 64, example: my-lucky-seed }
      responses:
        "204": { description: Stored }
        "409": { description: "seed_locked: open already paid or resolved", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "invalid_seed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /opens/{openId}/pay:
    post:
      tags: [opens]
      summary: Pay for the open (card via provider, or site credit); idempotent
      description: If no client seed was set, the server fills the published default (grailnoir-default) and records clientSeedSource = server-default.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/openId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, idempotencyKey]
              properties:
                method: { type: string, enum: [card, credit] }
                paymentToken: { type: string, description: provider token when method is card }
                idempotencyKey: { type: string }
      responses:
        "200":
          description: Paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [paid] }
                  clientSeed: { type: string }
                  clientSeedSource: { type: string, enum: [player, server-default] }
                  creditBalance: { type: integer }
        "402": { description: "payment_failed or insufficient_credit", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "open_not_payable or open_expired", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /opens/{openId}/spin:
    post:
      tags: [opens]
      summary: Resolve the open from the pinned snapshots and reveal the secret (once)
      description: >-
        Loads the table and bonus snapshots by the hashes pinned at create time (never the current versions), computes
        the digest, the roll, the band, any free spins; writes the item award or credit ledger entries in the same
        transaction; returns the full record including the revealed server seed. A retry returns the stored result,
        never a new roll.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/openId" }]
      responses:
        "200":
          description: Resolved (also on retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenResolved" }
        "409": { description: "open_not_paid", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /opens/{openId}:
    get:
      tags: [opens]
      summary: Read an open; the server seed is present only after reveal
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/openId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/OpenCommitted" }
                  - { $ref: "#/components/schemas/OpenResolved" }
        "404": { $ref: "#/components/responses/Error" }

  /me/opens:
    get:
      tags: [opens]
      summary: The caller's opens, newest first (resolved ones carry the revealed seed)
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: cursor on createdAt }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: "#/components/schemas/OpenCommitted" }
                        - { $ref: "#/components/schemas/OpenResolved" }
                  nextBefore: { type: string, format: date-time, nullable: true }

  /me/awards:
    get:
      tags: [awards]
      summary: The caller's item awards (awarded, shipping, shipped, traded), newest first
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [awarded, shipping, shipped, traded, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Award" }
                  nextBefore: { type: string, format: date-time, nullable: true }

  /awards/{awardId}/trade-in:
    post:
      tags: [awards, credit]
      summary: Trade an awarded item in for credit at the rate stored on the award
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/awardId" }]
      responses:
        "200":
          description: Credited
          content:
            application/json:
              schema:
                type: object
                properties:
                  award: { $ref: "#/components/schemas/Award" }
                  credits: { type: integer }
                  creditBalance: { type: integer }
        "409": { description: "award_not_tradeable: already shipping, shipped or traded", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /awards/{awardId}/ship:
    post:
      tags: [awards]
      summary: Ask for the item to be shipped; the award moves to shipping
      description: Records the address and the fee quoted at request time. Carrier, label and insurance are the main site's fulfilment; update the shipment through admin.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/awardId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  award: { $ref: "#/components/schemas/Award" }
                  shipment: { $ref: "#/components/schemas/Shipment" }
        "409": { description: "award_not_shippable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "validation_failed (address)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/credits:
    get:
      tags: [credit]
      summary: Credit balance and ledger
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: integer }
                  ledger:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerEntry" }

  /verify:
    get:
      tags: [verify]
      summary: Public, stateless recomputation of an open, with one check per claim
      description: >-
        Recomputes sha256(serverSeed), the digest, the roll and the outcome against the table identified by tableHash
        (loaded from the snapshot store), and the bonus spins with nonces 2, 3… against the bonus table identified by
        bonusHash. Optional claims (serverHash, outcomeId, bonusCredits) are compared and reported one by one.
        ok is true only when every check passes. Anyone may call it.
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string } }
        - { name: serverSeed, in: query, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: clientSeed, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: tableHash, in: query, required: true, schema: { type: string } }
        - { name: bonusHash, in: query, required: false, schema: { type: string } }
        - { name: serverHash, in: query, required: false, schema: { type: string }, description: the hash shown before payment }
        - { name: outcomeId, in: query, required: false, schema: { type: string }, description: the outcome the player was shown }
        - { name: bonusCredits, in: query, required: false, schema: { type: string, example: "2,1" }, description: credits of each free spin in nonce order, comma separated }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
        "404": { description: "unknown_table", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /tables/{tableHash}:
    get:
      tags: [verify]
      summary: The frozen odds table for a hash (public)
      parameters:
        - { name: tableHash, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TableSnapshot" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /bonus-tables/{bonusHash}:
    get:
      tags: [verify]
      summary: The frozen free-spin table for a hash (public)
      parameters:
        - { name: bonusHash, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BonusTableSnapshot" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /tables/log:
    get:
      tags: [verify]
      summary: Public append-only log of every table activation (box, hashes, segment, time)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    boxSlug: { type: string }
                    tableHash: { type: string }
                    bonusHash: { type: string, nullable: true }
                    segmentId: { type: string, nullable: true }
                    publishedAt: { type: string, format: date-time }

  /admin/boxes:
    post:
      tags: [admin]
      summary: Create or update a box from the catalogue export, with its outcomes and bonus table
      description: >-
        Upserts the box and its outcomes (ids are the catalogue's and survive table versions), creates table version 1
        and bonus version 1 from the given percents, validates them (sum 100, whole credits, values on items), activates
        both and publishes the hashes. Later odds changes go through /admin/boxes/{slug}/tables.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxUpsert" }
      responses:
        "200":
          description: Upserted, with the maths preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Box" }
        "422": { description: "validation_failed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/boxes/{slug}/tables:
    post:
      tags: [admin]
      summary: Create a new table version (validated, not yet active)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [id, percent]
                    properties:
                      id: { type: string }
                      percent: { type: number, minimum: 0 }
                note: { type: string }
      responses:
        "201":
          description: Created, with the maths preview
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/TableSnapshot" }
                  - type: object
                    properties:
                      maths: { $ref: "#/components/schemas/TableMaths" }
        "422": { description: "validation_failed: percents do not sum to 100, missing outcome, negative percent", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/boxes/{slug}/tables/{tableId}/activate:
    post:
      tags: [admin]
      summary: Make a table version current (publishes its hash to the log)
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { name: tableId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Activated and published }

  /admin/boxes/{slug}/bonus-tables:
    post:
      tags: [admin]
      summary: Create a new bonus table version (validated, not yet active)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items: { $ref: "#/components/schemas/BonusEntry" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BonusTableSnapshot" } } } }
        "422": { description: "validation_failed", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/boxes/{slug}/bonus-tables/{bonusId}/activate:
    post:
      tags: [admin]
      summary: Make a bonus table version current (publishes its hash to the log)
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/slug" }
        - { name: bonusId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Activated and published }

  /admin/shipments/{shipmentId}:
    patch:
      tags: [admin]
      summary: Update a shipment (carrier, tracking, status); shipped marks the award shipped
      security: [{ adminBearer: [] }]
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                carrier: { type: string }
                tracking: { type: string }
                status: { type: string, enum: [requested, label, shipped, delivered, cancelled] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Shipment" } } } }

  /admin/segments:
    get:
      tags: [admin]
      summary: List segments and their table overrides
      security: [{ adminBearer: [] }]
      responses:
        "200": { description: OK }
    post:
      tags: [admin]
      summary: Create a segment
      security: [{ adminBearer: [] }]
      responses:
        "201": { description: Created }

  /admin/segments/{segmentId}/tables/{slug}:
    put:
      tags: [admin]
      summary: Point a segment at a table version for a box (publishes to the log)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/slug" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableId]
              properties:
                tableId: { type: string, format: uuid }
      responses:
        "204": { description: Set }

  /battles:
    get:
      tags: [battles]
      summary: Public battles and the caller's own, newest first
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, full, in_progress, settling, finished, cancelled, expired] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: mine, in: query, schema: { type: boolean, default: false }, description: only battles the caller sat in (for Your battles and game history) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Battle" } } } } }
    post:
      tags: [battles]
      summary: Create a battle within the admin limits; the creator takes seat 0 and pays the hold; the server hash is returned
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, seats, boxSlugs, idempotencyKey]
              properties:
                mode: { type: string, enum: [normal, crazy, terminal, jackpot, group, break, coinflip] }
                seats: { type: integer, minimum: 2, maximum: 16 }
                boxSlugs: { type: array, items: { type: string }, description: one per round, in order; eligible boxes only }
                isPrivate: { type: boolean, default: false }
                idempotencyKey: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "402": { description: insufficient_credit, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: validation_failed or battles_disabled, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: rate_limited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /battles/events:
    get:
      tags: [battles]
      summary: The lobby stream (server-sent events) - room opened, seat taken, seat left, status changed, room settled; public rooms only
      security: [{ bearer: [] }]
      responses:
        "200": { description: text/event-stream; each event carries the battle id, the event, and the battle as it now stands }

  /battles/{battleId}:
    get:
      tags: [battles]
      summary: The battle as it stands; pulls appear as rounds resolve; serverSeed only when finished
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /battles/{battleId}/join:
    post:
      tags: [battles]
      summary: Take the first free seat (any seat number); the server generates the seat's seed; the credit hold is taken in the same transaction; idempotent on the key
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                inviteCode: { type: string }
                idempotencyKey: { type: string }
      responses:
        "200": { description: Seated, content: { application/json: { schema: { $ref: "#/components/schemas/BattleSeat" } } } }
        "402": { description: insufficient_credit, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: forbidden (invite code), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: battle_not_open, battle_full or already_seated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /battles/{battleId}/leave:
    post:
      tags: [battles]
      summary: Leave before the start; the hold is released; a full battle goes back to open
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      responses:
        "204": { description: Left }
        "409": { description: battle_started, not_seated or creator_must_cancel, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /battles/{battleId}/cancel:
    post:
      tags: [battles]
      summary: Cancel before the start (creator while alone, or admin); every hold is refunded
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "204": { description: Cancelled and refunded }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: battle_started, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /battles/{battleId}/bots:
    post:
      tags: [battles]
      summary: The creator asks bots to fill the free seats (admin bots on); the battle becomes full and the countdown starts
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      responses:
        "200": { description: Filled, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "403": { description: not_creator, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: bots_disabled, battle_not_open or battle_full, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /battles/{battleId}/events:
    get:
      tags: [battles]
      summary: Server-sent events for the battle (joined, left, full, countdown, started, round, finished, cancelled, expired, revealed)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      responses:
        "200": { description: text/event-stream; each event carries the battle_events row }

  /battles/{battleId}/verify:
    get:
      tags: [battles, verify]
      summary: Public recomputation of a finished battle, one boolean per claim
      parameters:
        - { $ref: "#/components/parameters/battleId" }
        - { name: serverHash, in: query, schema: { type: string } }
        - { name: winners, in: query, schema: { type: string, example: "1" }, description: comma separated seat numbers }
        - { name: totals, in: query, schema: { type: string, example: "1234,5678" }, description: comma separated cents per seat }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BattleVerifyResult" } } } }
        "409": { description: battle not finished, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/battles/settings:
    get:
      tags: [admin, battles]
      summary: The battle settings (one row per site)
      security: [{ adminBearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BattleSettings" } } } }
    put:
      tags: [admin, battles]
      summary: Update the settings; changes apply to new battles only
      security: [{ adminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BattleSettings" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BattleSettings" } } } }
        "422": { description: validation_failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/battles/{battleId}/cancel:
    post:
      tags: [admin, battles]
      summary: Admin cancel before the start, with a reason; every hold is refunded; audited
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/battleId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        "204": { description: Cancelled and refunded }
        "409": { description: battle_started, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/battles/bots:
    get:
      tags: [admin, battles]
      summary: The bot list (name and picture, nothing else)
      security: [{ adminBearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BattleBot" } } } } }
    put:
      tags: [admin, battles]
      summary: Replace the bot list
      security: [{ adminBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BattleBot" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BattleBot" } } } } }


  /admin/battles/report:
    get:
      tags: [admin, battles]
      summary: Battles played and gross gaming revenue per day and mode (player money only; the view battle_daily_report)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BattleReportRow" } } } } }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Issued by the main site's auth (Supabase Auth in the plan of record). The API verifies the signature (JWT
        secret or JWKS), takes `sub` as the player's external id and creates the player on first sight. The front
        end's mock accepts any token.
    adminBearer:
      type: http
      scheme: bearer
      description: A separate admin token (service role or an admin JWT claim).
  parameters:
    slug: { name: slug, in: path, required: true, schema: { type: string } }
    openId: { name: openId, in: path, required: true, schema: { type: string, format: uuid } }
    awardId: { name: awardId, in: path, required: true, schema: { type: string, format: uuid } }
    battleId: { name: battleId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unknown_box, unknown_open, unknown_award, unknown_table, open_expired, seed_locked, open_not_payable, open_not_paid, payment_failed, insufficient_credit, award_not_tradeable, award_not_shippable, invalid_seed, validation_failed, unauthenticated, forbidden, rate_limited, internal, battles_disabled, battle_not_open, battle_full, already_seated, battle_started, not_seated, creator_must_cancel, battle_not_startable, battle_incomplete, conflict, bots_disabled, not_creator]
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Outcome:
      type: object
      required: [id, label, rarity, kind, credits, freeSpins, valueCents, percent]
      properties:
        id: { type: string, description: the catalogue's id; stable across table versions }
        label: { type: string }
        rarity: { type: string, description: common | uncommon | rare | epic | legendary | grail | bonus (the catalogue's words) }
        kind: { type: string, enum: [item, credit, bonus], description: bonus = credit plus free spins }
        credits: { type: integer, description: whole credits paid by this outcome; 0 for items }
        freeSpins: { type: integer, minimum: 0, maximum: 3 }
        valueCents: { type: integer, nullable: true, description: listed value for items; null for credit and bonus }
        percent: { type: number, description: chance in percent; the box sums to 100 }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
    TableSnapshot:
      type: object
      properties:
        boxSlug: { type: string }
        version: { type: integer }
        tableHash: { type: string }
        price: { type: number, description: the dollar price that went into the hash (10, not 1000) }
        priceCents: { type: integer }
        entries:
          type: array
          description: in stored order; exactly the numbers that were hashed
          items:
            type: object
            properties:
              id: { type: string }
              percent: { type: number }
    BonusEntry:
      type: object
      required: [credits, percent]
      properties:
        credits: { type: integer }
        percent: { type: number }
    BonusTableSnapshot:
      type: object
      properties:
        boxSlug: { type: string }
        version: { type: integer }
        bonusHash: { type: string, description: "sha256(canonicalJson({ slug, bonus: entries }))" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/BonusEntry" }
    Box:
      type: object
      required: [slug, name, tagline, price, priceCents, tradeInPercent, tableHash, bonusHash, outcomes, bonus, maths]
      properties:
        slug: { type: string }
        name: { type: string }
        tagline: { type: string }
        price: { type: number, description: dollars as listed (hashed) }
        priceCents: { type: integer }
        tradeInPercent: { type: integer, description: credits paid for an item = round(valueCents × tradeInPercent ÷ 100 ÷ 100) }
        tableHash: { type: string }
        bonusHash: { type: string }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/Outcome" }
        bonus:
          type: array
          items: { $ref: "#/components/schemas/BonusEntry" }
        maths: { $ref: "#/components/schemas/TableMaths" }
    BoxUpsert:
      type: object
      required: [slug, name, price, outcomes]
      properties:
        slug: { type: string }
        name: { type: string }
        tagline: { type: string }
        price: { type: number, description: dollars }
        tradeInPercent: { type: integer, default: 90 }
        active: { type: boolean, default: true }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/Outcome" }
        bonus:
          type: array
          items: { $ref: "#/components/schemas/BonusEntry" }
    TableMaths:
      type: object
      description: Per-open sums, so the front end can show "pays back per open" honestly
      properties:
        pItem: { type: number, description: chance of a physical item, 0..1 }
        evItemsCents: { type: number }
        evCredits: { type: number }
        payFaceCents: { type: number, description: items at listed plus credits at face }
        returnFace: { type: number }
    OpenCommitted:
      type: object
      properties:
        openId: { type: string, format: uuid }
        boxSlug: { type: string }
        status: { type: string, enum: [created, paid, expired] }
        priceCents: { type: integer }
        serverHash: { type: string, description: sha256 of the server seed, shown before payment }
        tableHash: { type: string }
        bonusHash: { type: string }
        nonce: { type: integer, example: 1 }
        clientSeed: { type: string, nullable: true }
        clientSeedSource: { type: string, nullable: true, enum: [player, server-default] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BonusSpin:
      type: object
      properties:
        nonce: { type: integer }
        digest: { type: string }
        roll: { type: number }
        credits: { type: integer }
    OpenResolved:
      allOf:
        - { $ref: "#/components/schemas/OpenCommitted" }
        - type: object
          properties:
            status: { type: string, enum: [resolved] }
            serverSeed: { type: string, description: revealed after the spin }
            digest: { type: string }
            roll: { type: number }
            outcome: { $ref: "#/components/schemas/Outcome" }
            bonusSpins:
              type: array
              items: { $ref: "#/components/schemas/BonusSpin" }
            creditsAwarded: { type: integer }
            itemAward:
              type: object
              nullable: true
              properties:
                awardId: { type: string, format: uuid }
                valueCents: { type: integer }
                tradeInPercent: { type: integer }
                tradeInCredits: { type: integer }
            verifyUrl: { type: string, description: "/v1/verify with slug, serverSeed, clientSeed, tableHash, bonusHash, serverHash, outcomeId, bonusCredits" }
            resolvedAt: { type: string, format: date-time }
    Address:
      type: object
      required: [name, line1, city, postalCode, country]
      properties:
        name: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        phone: { type: string }
    Shipment:
      type: object
      properties:
        shipmentId: { type: string, format: uuid }
        awardId: { type: string, format: uuid }
        address: { $ref: "#/components/schemas/Address" }
        feeCents: { type: integer }
        carrier: { type: string, nullable: true }
        tracking: { type: string, nullable: true }
        status: { type: string, enum: [requested, label, shipped, delivered, cancelled] }
        requestedAt: { type: string, format: date-time }
    Award:
      type: object
      properties:
        awardId: { type: string, format: uuid }
        openId: { type: string, format: uuid }
        boxSlug: { type: string }
        outcome: { $ref: "#/components/schemas/Outcome" }
        valueCents: { type: integer }
        status: { type: string, enum: [awarded, shipping, shipped, traded, cancelled] }
        tradeInPercent: { type: integer }
        tradeInCredits: { type: integer }
        shipment: { $ref: "#/components/schemas/Shipment", nullable: true }
        createdAt: { type: string, format: date-time }
    VerifyResult:
      type: object
      properties:
        ok: { type: boolean, description: true only when every check below is true }
        checks:
          type: object
          description: one boolean per claim; null when the claim was not supplied
          properties:
            serverHash: { type: boolean, nullable: true }
            tableHash: { type: boolean }
            bonusHash: { type: boolean, nullable: true }
            outcome: { type: boolean, nullable: true }
            bonusSpins: { type: boolean, nullable: true }
        serverHash: { type: string }
        digest: { type: string }
        roll: { type: number }
        outcomeId: { type: string }
        bonusSpins:
          type: array
          items: { $ref: "#/components/schemas/BonusSpin" }
        reason: { type: string, nullable: true }
    BattleSettings:
      type: object
      properties:
        enabled: { type: boolean }
        modesAllowed: { type: array, items: { type: string, enum: [normal, crazy, terminal, jackpot, group, break, coinflip] } }
        seatsAllowed: { type: array, items: { type: integer } }
        roundsMax: { type: integer, minimum: 1, maximum: 50 }
        eligibleBoxSlugs: { type: array, items: { type: string } }
        feePercent: { type: number, minimum: 0, maximum: 20 }
        coinflipEdge: { type: number, minimum: 0, maximum: 0.1 }
        openExpiryMinutes: { type: integer }
        countdownSeconds: { type: integer }
        privateAllowed: { type: boolean }
        botsEnabled: { type: boolean }
        botLabel: { type: string }
        maxConcurrentPerPlayer: { type: integer }
        creditFaceCents: { type: integer }
    BattleRound:
      type: object
      properties:
        slug: { type: string }
        tableHash: { type: string }
        bonusHash: { type: string }
        priceCents: { type: integer }
    BattleSeat:
      type: object
      properties:
        seat: { type: integer }
        playerId: { type: string, nullable: true }
        displayName: { type: string }
        isBot: { type: boolean }
        botName: { type: string, nullable: true }
        botAvatarUrl: { type: string, nullable: true }
        clientSeed: { type: string }
        clientSeedSource: { type: string, enum: [server, bot], description: seat seeds are always generated by the server }
        joinedAt: { type: string, format: date-time }
    BattlePull:
      type: object
      properties:
        round: { type: integer }
        seat: { type: integer }
        nonce: { type: integer }
        digest: { type: string }
        roll: { type: number }
        outcome: { $ref: "#/components/schemas/Outcome" }
        valueCents: { type: integer }
        credits: { type: integer }
        awardId: { type: string, format: uuid, nullable: true }
    Battle:
      type: object
      properties:
        battleId: { type: string, format: uuid }
        status: { type: string, enum: [open, full, in_progress, settling, finished, cancelled, expired] }
        version: { type: integer }
        mode: { type: string, enum: [normal, crazy, terminal, jackpot, group, break, coinflip] }
        seats: { type: integer }
        rounds: { type: array, items: { $ref: "#/components/schemas/BattleRound" } }
        entryCents: { type: integer }
        feePercent: { type: number }
        coinflipEdge: { type: number }
        isPrivate: { type: boolean }
        inviteCode: { type: string, nullable: true, description: only to the creator }
        displayStatus: { type: string, enum: [Waiting, Ongoing, Settled, Cancelled, Expired], description: the plain word for the status }
        createdBy: { type: string }
        creatorName: { type: string }
        createdAt: { type: string, format: date-time }
        serverHash: { type: string, description: shown before any seat is taken }
        serverSeed: { type: string, nullable: true, description: only when finished }
        seatList: { type: array, items: { $ref: "#/components/schemas/BattleSeat" } }
        pulls: { type: array, items: { $ref: "#/components/schemas/BattlePull" }, description: appear as rounds resolve }
        totalsCents: { type: array, items: { type: integer }, nullable: true }
        potCents: { type: integer, nullable: true }
        winners: { type: array, items: { type: integer }, nullable: true }
        sharesCents: { type: array, items: { type: integer }, nullable: true }
        tiedSeats: { type: array, items: { type: integer }, nullable: true }
        extra: { type: object, nullable: true, properties: { nonce: { type: integer }, digest: { type: string }, roll: { type: number } } }
        expiresAt: { type: string, format: date-time }
        startsAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        settledAt: { type: string, format: date-time, nullable: true }
        verifyUrl: { type: string, nullable: true }
    BattleBot:
      type: object
      required: [name]
      properties:
        id: { type: integer }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        enabled: { type: boolean, default: true }
    BattleReportRow:
      type: object
      properties:
        day: { type: string, format: date }
        mode: { type: string }
        battles: { type: integer }
        battlesWithBots: { type: integer }
        playerEntriesCents: { type: integer }
        creditPaidCents: { type: integer }
        itemsPaidCents: { type: integer }
        ggrCents: { type: integer }
    BattleVerifyResult:
      type: object
      properties:
        ok: { type: boolean }
        checks:
          type: object
          properties:
            serverHash: { type: boolean, nullable: true }
            winners: { type: boolean, nullable: true }
            totals: { type: boolean, nullable: true }
            pulls: { type: boolean, nullable: true }
        winners: { type: array, items: { type: integer } }
        totalsCents: { type: array, items: { type: integer } }
        pulls: { type: array, items: { $ref: "#/components/schemas/BattlePull" } }
        reason: { type: string, nullable: true }
    LedgerEntry:
      type: object
      properties:
        id: { type: integer }
        delta: { type: integer }
        reason: { type: string }
        refType: { type: string, nullable: true }
        refId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
